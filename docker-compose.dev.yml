version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: event_picker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event_picker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event_picker_backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/events_db
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event_picker_scheduler
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/events_db
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -c "from scheduler.scheduler import start_scheduler; start_scheduler()"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: event_picker_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /c/Users/anastasia/Desktop/event-picker-new/frontend/build:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: